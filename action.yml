name: Sphinx
description: Fail the build when documents and images about to be published leak what they hide.
author: Sphinx contributors
branding:
  icon: eye-off
  color: yellow

inputs:
  paths:
    description: Files or directories to inspect, separated by spaces.
    default: "."
  fail-on:
    description: Lowest severity that fails the step (low, medium, high, critical, never).
    default: medium
  args:
    description: Extra arguments, such as --exclude testdata.
    default: ""
  sarif:
    description: Path of a SARIF report to write for GitHub code scanning; empty to skip.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: "1.24"
        cache: false
    - name: Build Sphinx
      shell: bash
      run: go build -C "$GITHUB_ACTION_PATH" -trimpath -o "$RUNNER_TEMP/sphinx" ./cmd/sphinx
    - name: Question the files
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        FAIL_ON: ${{ inputs.fail-on }}
        ARGS: ${{ inputs.args }}
        SARIF: ${{ inputs.sarif }}
      run: |
        set -f
        if [ -n "$SARIF" ]; then
          "$RUNNER_TEMP/sphinx" --format sarif --fail-on never $ARGS $PATHS > "$SARIF" || true
        fi
        "$RUNNER_TEMP/sphinx" --fail-on "$FAIL_ON" $ARGS $PATHS
